# Do shears take durability damage / break when used to make a frame invisible.
doShearsBreak: true

# Allow restoring invisible frames with leather. Also controls whether an invisible
# frame keeps its invisibility when broken and placed again.
fixWithLeather: true

# Item name shown on an invisible frame.
invisibleFrameName: "Invisible Item Frame"

# Item name shown on an invisible glow frame.
invisibleGlowFrameName: "Invisible Glow Item Frame"
