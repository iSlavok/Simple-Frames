# Do shears take durability damage / break when used to make a frame invisible.
doShearsBreak: true

# Allow restoring invisible frames with leather. Also controls whether an invisible
# frame keeps its invisibility when broken and placed again.
fixWithLeather: true

# Item name shown on an invisible frame.
invisibleFrameName: "Invisible Item Frame"

# Item name shown on an invisible glow frame.
invisibleGlowFrameName: "Invisible Glow Item Frame"

# Enable the wax feature: honeycomb locks an item's rotation, an axe unlocks it.
enableWax: true

# false = waxing blocks only right-click (rotation / item change);
# true  = a waxed frame is also fully invulnerable while waxed.
waxFullLock: false

# Do axes lose durability when removing wax.
doAxeBreak: true

# Which mouse button triggers each interaction: LEFT, RIGHT, or BOTH.
# For shears/leather on RIGHT (or BOTH): sneak + right-click = vanilla place/rotate,
# plain right-click = the mod action.
shearsButton: LEFT
leatherButton: LEFT
honeycombButton: BOTH
axeButton: BOTH

# Do leather / honeycomb get consumed when used.
doLeatherConsume: true
doHoneycombConsume: true
